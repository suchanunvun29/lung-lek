services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales-eval-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:4000
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
    container_name: sales-eval-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: sales-eval-docs
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    container_name: sales-eval-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - docs
